[package]
name = "inderun_route_core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared Rust route-planning core for IndeRun."

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jni = { version = "0.22.4", optional = true }

# wasm-bindgen's entry point in src/ffi.rs is cfg-gated to wasm; gating the
# dependency too keeps it out of every other target's build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[features]
default = []
# Compiles the JNI entry point in src/ffi.rs. A feature rather than a
# `cfg(target_os = "android")` gate because the JVM unit tests in android/ load a
# host-built library: with a target gate the symbol would exist only in the
# Android build, and no test could ever reach the real planner. src/lib.rs makes
# an Android build without this feature a compile error, so the seam cannot be
# missed in the direction that matters.
jni-bindings = ["dep:jni"]

