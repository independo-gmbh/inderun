[package]
name = "inderun_route_core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared Rust route-planning core for IndeRun."

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# The JNI and wasm-bindgen entry points in src/ffi.rs are already cfg-gated to
# their platforms; gating the dependencies too keeps them out of every other
# target's build. That matters for the Apple static library, which is linked
# into consumer apps.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[features]
default = []

