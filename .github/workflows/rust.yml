name: Rust

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - 'rust/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/rust.yml'

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        # Intentionally not SHA-pinned: the action only provides rustup/cargo, and
        # rust-toolchain.toml decides which compiler actually runs. The version
        # must not be restated here -- see docs/ci.md.
        uses: dtolnay/rust-toolchain@stable

      # The action above only provides rustup. No arguments, so the version still
      # comes only from rust-toolchain.toml -- see docs/ci.md for why this is a
      # step rather than left to rustup.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update
        with:
          components: rustfmt, clippy

      - name: Cache Cargo state
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            rust/inderun-route-core -> target
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt -p inderun_route_core -- --check

      - name: Run Clippy
        run: cargo clippy -p inderun_route_core --all-targets -- -D warnings

      - name: Run route-core tests
        run: cargo test -p inderun_route_core
