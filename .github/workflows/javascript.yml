name: JavaScript

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: javascript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      js: ${{ steps.filter.outputs.js }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            js:
              - 'packages/**'
              - 'contracts/**'
              - 'rust/inderun-route-core/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.github/workflows/javascript.yml'

  javascript:
    name: JavaScript
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm 11.9.0
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust toolchain
        # Intentionally not SHA-pinned: this tracks whatever "stable" Rust
        # currently is, which is the point of using it here.
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo state
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            rust/inderun-route-core -> target
          cache-on-failure: true

      - name: Cache wasm-bindgen CLI
        id: cache-wasm-bindgen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-wasm-bindgen-cli-0.2.125

      - name: Install wasm-bindgen CLI
        if: steps.cache-wasm-bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.125 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check:js

      - name: Generate contracts
        run: pnpm generate:code

      # The Kotlin data-contracts output (android/inderun-contracts/.../Contracts.kt)
      # is deliberately excluded here: this job runs `pnpm generate:code` (no
      # Gradle toolchain), which skips the `generate:kotlin` Spotless pass that
      # the committed file requires to stay ktlint-clean. Diffing it here would
      # always report spurious formatting drift. The Android workflow's
      # `spotlessCheck` step covers that file's formatting, and this repo's
      # release workflow's drift check (which runs the full `pnpm generate`,
      # Spotless included) covers real content drift for it.
      - name: Verify generated contracts and API surface are up to date
        run: git diff --exit-code -- packages/contracts/src/generated ios/IndeRun/Sources/IndeRunContracts rust/inderun-route-core/src/generated packages/inderun-web/src/core/generated android/inderun-kotlin/src/main/kotlin/app/independo/inderun/sdk/generated ios/IndeRun/Sources/IndeRunSwift/Generated

      - name: Build Rust WASM bindings
        run: |
          RUSTC="$(rustup which rustc --toolchain stable)" \
            rustup run stable cargo build -p inderun_route_core --target wasm32-unknown-unknown

          wasm-bindgen target/wasm32-unknown-unknown/debug/inderun_route_core.wasm \
            --target web \
            --out-dir packages/inderun-route-core-wasm/generated \
            --out-name inderun_route_core

      - name: Build workspace
        run: pnpm build

      - name: Test workspace
        run: pnpm test:js
