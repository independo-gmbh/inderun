name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1" # weekly full scan, matching prior default-setup cadence

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-latest' || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    timeout-minutes: ${{ matrix.timeout-minutes || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none
          # Buildless. The manual build this replaced ran `./gradlew assembleDebug`,
          # which reaches :inderun-core:buildRouteCoreAndroid and cross-compiles the
          # Rust route core for four ABIs -- output CodeQL never reads, since it
          # extracts Kotlin source. That coupling made a change to the Rust build
          # silently break the Kotlin security scan (#204), and it put a four-ABI
          # cross-compile on the critical path of every PR into main.
          - language: java-kotlin
            build-mode: none
          - language: swift
            build-mode: manual
            # swift build pulls in onnxruntime-swift-package-manager (large prebuilt
            # XCFramework) plus swift-huggingface/swift-transformers/swift-nio/swift-crypto
            # -- a cold build can exceed the default 30min job timeout.
            timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # .build/ holds SwiftPM checkouts (e.g. swift-huggingface) -- vendored
          # dependency source we don't control, not our code to fix findings in.
          config: |
            paths-ignore:
              - '.build/**'

      # Cache SwiftPM checkouts/build artifacts (repo-root .build) keyed on
      # Package.resolved so unchanged dependencies (onnxruntime-swift-package-manager's
      # XCFramework, swift-huggingface, swift-transformers, swift-nio, ...) aren't
      # re-fetched/re-built on every run.
      - name: Cache SwiftPM dependencies
        if: matrix.language == 'swift'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      # Fast manual Swift build of the SwiftPM library targets, replacing the
      # autobuilder (which picks the ios/SampleApps demo xcodeproj and fails).
      # The SwiftPM manifest lives at the repository root (sources under ios/IndeRun).
      - name: Build Swift package
        if: matrix.language == 'swift'
        run: swift build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
