name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1" # weekly full scan, matching prior default-setup cadence

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-latest' || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    timeout-minutes: ${{ matrix.timeout-minutes || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: swift
            build-mode: manual
            # swift build pulls in onnxruntime-swift-package-manager (large prebuilt
            # XCFramework) plus swift-huggingface/swift-transformers/swift-nio/swift-crypto
            # -- a cold build can exceed the default 30min job timeout.
            timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # java-kotlin manual build needs the same toolchain as android.yml
      - name: Set up Java 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      # inderun-onnx-providers declares a CMake native target (see its build.gradle.kts) solely to
      # get AGP to package libc++_shared.so; assembleDebug reaches those tasks, so the NDK/CMake
      # must be present -- android-actions/setup-android doesn't install them by default.
      - name: Cache Android NDK and CMake
        if: matrix.language == 'java-kotlin'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
            ${{ env.ANDROID_HOME }}/cmake/3.22.1
          key: android-ndk-27.2.12479018-cmake-3.22.1

      - name: Install Android NDK and CMake
        if: matrix.language == 'java-kotlin'
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # .build/ holds SwiftPM checkouts (e.g. swift-huggingface) -- vendored
          # dependency source we don't control, not our code to fix findings in.
          config: |
            paths-ignore:
              - '.build/**'

      # Explicit Gradle build of all Android modules (debug variant, no release
      # signing, tests skipped), instead of letting autobuild guess a target.
      - name: Build Android modules
        if: matrix.language == 'java-kotlin'
        working-directory: android
        run: ./gradlew assembleDebug

      # Cache SwiftPM checkouts/build artifacts (repo-root .build) keyed on
      # Package.resolved so unchanged dependencies (onnxruntime-swift-package-manager's
      # XCFramework, swift-huggingface, swift-transformers, swift-nio, ...) aren't
      # re-fetched/re-built on every run.
      - name: Cache SwiftPM dependencies
        if: matrix.language == 'swift'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      # Fast manual Swift build of the SwiftPM library targets, replacing the
      # autobuilder (which picks the ios/SampleApps demo xcodeproj and fails).
      # The SwiftPM manifest lives at the repository root (sources under ios/IndeRun).
      - name: Build Swift package
        if: matrix.language == 'swift'
        run: swift build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
