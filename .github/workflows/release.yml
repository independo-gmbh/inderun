name: Release

on:
  push:
    branches:
      - main
      - dev

# Prevent overlapping releases on the same branch.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create GitHub releases + push the version/changelog commit
      issues: write # comment on released issues
      pull-requests: write # comment on released PRs
      id-token: write # OIDC for npm Trusted Publishing + provenance

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          persist-credentials: true
          # Use a PAT/App token (GH_TOKEN) so semantic-release can push the
          # version/changelog commit + tag to protected main and back-merge to
          # dev. Falls back to the default token if GH_TOKEN is not set.
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up pnpm 11.9.0
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Keep npm current: OIDC Trusted Publishing + provenance need npm >= 11.5.
      - name: Update npm
        run: npm i -g npm@^11

      - name: Set up Rust toolchain
        # Intentionally not SHA-pinned: this tracks whatever "stable" Rust
        # currently is, which is the point of using it here.
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo state
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            rust/inderun-route-core -> target
          cache-on-failure: true

      - name: Cache wasm-bindgen CLI
        id: cache-wasm-bindgen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-wasm-bindgen-cli-0.2.125

      - name: Install wasm-bindgen CLI
        if: steps.cache-wasm-bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.125 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate contracts
        run: pnpm generate

      - name: Verify generated contracts and API surface are up to date
        run: git diff --exit-code -- packages/contracts/src/generated android/inderun-contracts/src/main/kotlin ios/IndeRun/Sources/IndeRunContracts rust/inderun-route-core/src/generated packages/inderun-web/src/core/generated android/inderun-kotlin/src/main/kotlin/app/independo/inderun/sdk/generated ios/IndeRun/Sources/IndeRunSwift/Generated

      # `pnpm build` and `pnpm test:js` both call this too; running it explicitly
      # keeps the toolchain failure mode visible as its own step.
      - name: Build Rust WASM bindings
        run: pnpm build:wasm

      - name: Build workspace
        run: pnpm build

      - name: Test workspace (JS)
        run: pnpm test:js

      - name: Discard regenerated WASM bindings stub
        # packages/inderun-route-core-wasm/generated/inderun_route_core.d.ts is a
        # hand-written stub checked in on purpose (see its header comment, #109) so
        # `tsc` can resolve the import without the Rust/wasm-bindgen toolchain. The
        # "Build Rust WASM bindings" step above intentionally overwrites it with the
        # real generated bindings for this job's build/test steps. Revert that
        # overwrite now so the working tree is clean for semantic-release's dev
        # back-merge (git rebase requires no unstaged changes).
        run: git checkout -- packages/inderun-route-core-wasm/generated

      - name: Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
