version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Wait before proposing a freshly published version. Keep this >= the pnpm
    # `minimumReleaseAge` supply-chain policy so Dependabot PRs don't trip the
    # lockfile age check in CI.
    cooldown:
      default-days: 7
    groups:
      github-actions-routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Wait before proposing a freshly published version. Keep this >= the pnpm
    # `minimumReleaseAge` supply-chain policy so Dependabot PRs don't trip the
    # lockfile age check in CI.
    cooldown:
      default-days: 7
    # The website pins the published @independo/* packages to the tested set in
    # website/versions.json; those pins move only with that file (sync:markers,
    # check:versions), never through a Dependabot bump.
    ignore:
      - dependency-name: "@independo/*"
    groups:
      npm-routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Wait before proposing a freshly published version. Keep this >= the pnpm
    # `minimumReleaseAge` supply-chain policy so Dependabot PRs don't trip the
    # lockfile age check in CI.
    cooldown:
      default-days: 7
    groups:
      cargo-routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Wait before proposing a freshly published version. Keep this >= the pnpm
    # `minimumReleaseAge` supply-chain policy so Dependabot PRs don't trip the
    # lockfile age check in CI.
    cooldown:
      default-days: 7
    groups:
      gradle-routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Wait before proposing a freshly published version. Keep this >= the pnpm
    # `minimumReleaseAge` supply-chain policy so Dependabot PRs don't trip the
    # lockfile age check in CI.
    cooldown:
      default-days: 7
    groups:
      swift-routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
