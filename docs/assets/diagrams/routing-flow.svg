<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800" role="img" aria-labelledby="rf-title rf-desc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" fill="#000">
  <title id="rf-title">How IndeRun chooses where to run a request</title>
  <desc id="rf-desc">Flowchart, top to bottom. The app sends a task with execution constraints. IndeRun reads the registered providers' capabilities and the host conditions, then filters by task, mode, availability and hard policy constraints. One decision follows: is any provider eligible? If not, the request is refused with a normalized reason and nothing runs (outcome B). If so, IndeRun ranks the eligible providers, chooses a permitted route and executes through the selected provider. The result is either a run on the device (outcome A) or a run on a cloud target that the app configured and allowed (outcome C), returned with provenance.</desc>
  <defs>
    <marker id="rf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#000"/></marker>
  </defs>
  <rect width="400" height="800" fill="#FAF5EF"/>

  <rect x="40" y="20" width="320" height="48" fill="#FAF5EF" stroke="#000" stroke-width="1.5"/>
  <text x="200" y="40" font-size="13" text-anchor="middle" font-weight="600">1. App sends</text>
  <text x="200" y="57" font-size="12.5" text-anchor="middle">task + execution constraints</text>
  <line x1="200" y1="68" x2="200" y2="88" stroke="#000" stroke-width="1.5" marker-end="url(#rf-arrow)"/>

  <rect x="40" y="88" width="320" height="48" fill="#FAF5EF" stroke="#000" stroke-width="1.5"/>
  <text x="200" y="108" font-size="13" text-anchor="middle" font-weight="600">2. Read</text>
  <text x="200" y="125" font-size="12.5" text-anchor="middle">provider capabilities and host conditions</text>
  <line x1="200" y1="136" x2="200" y2="156" stroke="#000" stroke-width="1.5" marker-end="url(#rf-arrow)"/>

  <rect x="40" y="156" width="320" height="48" fill="#FAF5EF" stroke="#000" stroke-width="1.5"/>
  <text x="200" y="176" font-size="13" text-anchor="middle" font-weight="600">3. Filter</text>
  <text x="200" y="193" font-size="12.5" text-anchor="middle">task, mode, availability, hard policy limits</text>
  <line x1="200" y1="204" x2="200" y2="224" stroke="#000" stroke-width="1.5" marker-end="url(#rf-arrow)"/>

  <polygon points="200,224 300,290 200,356 100,290" fill="#A0B3FF" stroke="#000" stroke-width="1.5"/>
  <text x="200" y="286" font-size="13" text-anchor="middle" font-weight="600">4. Any eligible</text>
  <text x="200" y="303" font-size="13" text-anchor="middle" font-weight="600">provider?</text>

  <text x="210" y="376" font-size="12" font-weight="700">Yes</text>
  <line x1="200" y1="356" x2="200" y2="396" stroke="#000" stroke-width="1.5" marker-end="url(#rf-arrow)"/>
  <text x="316" y="282" font-size="12" font-weight="700">No</text>
  <path d="M300 290 H380 V680 H362" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#rf-arrow)"/>

  <rect x="40" y="396" width="320" height="48" fill="#FAF5EF" stroke="#000" stroke-width="1.5"/>
  <text x="200" y="416" font-size="13" text-anchor="middle" font-weight="600">5. Rank</text>
  <text x="200" y="433" font-size="12.5" text-anchor="middle">eligible providers; choose a permitted route</text>
  <line x1="200" y1="444" x2="200" y2="464" stroke="#000" stroke-width="1.5" marker-end="url(#rf-arrow)"/>

  <rect x="40" y="464" width="320" height="48" fill="#FAF5EF" stroke="#000" stroke-width="1.5"/>
  <text x="200" y="484" font-size="13" text-anchor="middle" font-weight="600">6. Execute</text>
  <text x="200" y="501" font-size="12.5" text-anchor="middle">through the selected provider</text>

  <path d="M200 512 V532 M126 532 H294" fill="none" stroke="#000" stroke-width="1.5"/>
  <line x1="126" y1="532" x2="126" y2="548" stroke="#000" stroke-width="1.5" marker-end="url(#rf-arrow)"/>
  <line x1="294" y1="532" x2="294" y2="548" stroke="#000" stroke-width="1.5" marker-end="url(#rf-arrow)"/>

  <rect x="40" y="548" width="172" height="76" fill="#FAF5EF" stroke="#000" stroke-width="1.5"/>
  <text x="50" y="568" font-size="12.5" font-weight="700">Outcome A</text>
  <text x="50" y="585" font-size="12">Ran on the device.</text>
  <text x="50" y="601" font-size="12">Result with provenance;</text>
  <text x="50" y="616" font-size="12">locality: on_device</text>
  <rect x="228" y="548" width="132" height="76" fill="#A0B3FF" stroke="#000" stroke-width="1.5"/>
  <text x="236" y="568" font-size="12.5" font-weight="700">Outcome C</text>
  <text x="236" y="585" font-size="12">Ran on a cloud</text>
  <text x="236" y="601" font-size="12">target you set up</text>
  <text x="236" y="616" font-size="12">and allowed</text>

  <rect x="40" y="648" width="320" height="64" fill="#FAF5EF" stroke="#000" stroke-width="2.5"/>
  <text x="50" y="668" font-size="12.5" font-weight="700">Outcome B: refused</text>
  <text x="50" y="685" font-size="12">Refused before any provider ran.</text>
  <text x="50" y="701" font-size="12">No provider was sent the task. The error lists why.</text>

  <text x="16" y="744" font-size="11.5">Illustration of selection logic, not an engine trace.</text>
  <text x="16" y="759" font-size="11.5">Host services inform availability; they are not a request step.</text>
  <text x="16" y="774" font-size="11.5">Outcome C exists only if a cloud target is configured and</text>
  <text x="16" y="789" font-size="11.5">the request permits it.</text>
</svg>
